# The package build of the runner's OS: Node from .nvmrc, `npm ci`, then the
# Justfile's `package` recipes one by one (`just natives`, `just build`,
# `just installer`), and the installer, its blockmap and latest*.yml as the
# artifact dist-<os>. release.yml's `build` uses it for the dry run and the
# release alike, so a dry run builds what a release builds. Nothing is signed:
# the Windows installer is unsigned, and macOS is not released.
#
# workflows-lint (actionlint, zizmor, pinact) scans .github/workflows only:
# keep the pins below on the same commits as the workflows by hand.
name: package
description: Build the FlockFlasher installer of the runner's OS into the artifact dist-<os>.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        # No cache: a release takes nothing from a cache another workflow wrote.
        package-manager-cache: false
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        just-version: "1.59.0"

    # usb (etcher-sdk's usbboot) compiles its bundled libusb with the udev backend.
    - name: libudev headers
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends libudev-dev

    # CI is set, so postinstall skips the packaging steps: `just natives` runs them.
    - name: npm ci
      shell: bash
      run: npm ci --no-audit --no-fund
    - name: just natives
      shell: bash
      run: just natives
    # An optional dependency: npm carries on when its native build fails, and the
    # installer would then ship without the Windows USB driver support.
    - name: winusb-driver-generator is built
      if: runner.os == 'Windows'
      shell: bash
      run: |
        ls node_modules/winusb-driver-generator/build/Release/*.node ||
          { echo "::error::winusb-driver-generator has no native build"; exit 1; }
    - name: just build
      shell: bash
      run: just build
    - name: just installer
      shell: bash
      run: just installer

    # overwrite: artifacts belong to the run, so a re-run of every job would
    # otherwise fail on the name an earlier attempt uploaded.
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-${{ runner.os }}
        path: |
          dist/*.exe
          dist/*.AppImage
          dist/*.blockmap
          dist/latest*.yml
        if-no-files-found: error
        overwrite: true
        retention-days: 7
