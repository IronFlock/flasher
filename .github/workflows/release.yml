# Release: the merge of a release pull request (`just release-patch`: version
# bump, title `release flockflasher v<version>`) sets the tag v<version> on the
# merged commit. The artifacts are then built, notarized and published per
# operating system with `just release` from that tag (see the Justfile).
# A no-release merge starts nothing: `paths` holds only the version file, and
# when a no-release pull request touches it anyway (a dependency) the job
# below is skipped by its merge title, so no runner starts.
name: release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Only on the merge of a release pull request. Written with the release
  # GitHub App's token from the `release` environment (deployments from main
  # only).
  tag:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release ')
    uses: IronFlock/workflows/.github/workflows/release-tag.yml@v1
    permissions:
      contents: read
    # The App key is a secret of the `release` environment; environment
    # secrets reach a reusable workflow only through `secrets: inherit`.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      version-file: package.json
