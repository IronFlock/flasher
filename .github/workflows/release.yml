# Release: the merge of a release pull request (`just release-patch`: version
# bump, title `release flockflasher v<version>`) builds the Linux and Windows
# installers, publishes them as the GitHub Release v<version> (with the
# latest*.yml files the in-app updater reads) and sets the tag v<version> on
# the merged commit.
#
# macOS is not released: notarization needs a membership in the Apple Developer
# Program, which has ended. Installed Mac apps stay on v2.1.2: their updater
# finds no latest-mac.yml in a newer release and offers nothing. `just package`
# on a Mac still builds an unsigned app for local use.
#
# The order keeps "a tag always means released", and the updater never sees a
# half-uploaded release:
#   verify     the harness's release.sh mode: release, released (a re-run
#              after the tag: nothing is rebuilt) or dry-run
#   build      the Linux and Windows installers, unsigned
#   publish    a DRAFT GitHub Release with every installer (the updater does not
#              see drafts)
#   tag        v<version>, set by the release GitHub App (release-tag.yml)
#   finalize   the draft becomes the published, latest release
# The release App's key is a secret of the `release` environment (deployments
# from main only). Every write to GitHub uses the App's token; GITHUB_TOKEN
# stays read-only. The Windows installer is unsigned: Windows SmartScreen warns
# on its first start, and the updater checks no signature (no publisherName).
#
# ci.yml calls this workflow on release pull requests (workflow_call), and a
# manual run (workflow_dispatch) only builds: a dry run builds the installers
# and publishes nothing. A no-release merge starts nothing: `paths`
# holds only the version file, and when a no-release pull request touches it
# anyway (a dependency) `verify` is skipped by its merge title.
#
# A failed release run: re-run it; publish replaces the draft's files, and tag
# and finalize pass when their work is done. A version given up after publish
# leaves a draft behind: `gh release delete v<version> --yes`.
name: release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    # A no-release merge that touches package.json anyway: no runner.
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, 'release ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      tag: ${{ steps.mode.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronFlock/workflows
          ref: v1
          path: .harness
          persist-credentials: false
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
      - name: what this run releases
        id: mode
        env:
          VERSION_FILE: package.json
          TAG_PREFIX: v
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_BRANCH: main
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: |
          mv .harness "$RUNNER_TEMP/harness"
          "$RUNNER_TEMP/harness/scripts/release.sh" mode

  build:
    name: build ${{ matrix.runner }}
    needs: verify
    if: needs.verify.outputs.mode != 'released'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on the oldest Ubuntu runner: the native modules link
        # against the build host's glibc, and a build on Ubuntu 24.04 would not
        # load on 22.04.
        runner: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/package

  publish:
    name: draft GitHub release
    needs: [verify, build]
    if: >-
      !cancelled() && needs.verify.outputs.mode == 'release' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    # No checkout: gh takes the repository from GH_REPO.
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - name: collect the installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: every updater file, of this version, with the files it names
        run: |
          ls -l dist
          for y in latest.yml latest-linux.yml; do
            [ -f "dist/$y" ] || { echo "::error::dist/$y is missing"; exit 1; }
            grep -qx "version: ${TAG#v}" "dist/$y" || { echo "::error::dist/$y is not version ${TAG#v}"; exit 1; }
            sed -n 's/^ *- url: //p' "dist/$y" | while read -r f; do
              [ -f "dist/$f" ] || { echo "::error::dist/$y names $f, which is missing"; exit 1; }
            done
          done
      - name: release App token (contents of this repository)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: draft release ${{ needs.verify.outputs.tag }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ github.sha }}
        run: |
          state=$(gh release list --limit 100 --json tagName,isDraft |
            jq -r --arg tag "$TAG" '.[] | select(.tagName == $tag) | if .isDraft then "draft" else "published" end')
          case "$state" in
            "")
              gh release create "$TAG" --draft --target "$SHA" --title "$TAG" --generate-notes dist/* ;;
            draft)
              echo "the draft release $TAG exists: replacing its files"
              gh release upload "$TAG" --clobber dist/* ;;
            *)
              echo "::error::the release $TAG is published, but its tag is not set"
              exit 1 ;;
          esac

  # The tag once every installer is in the draft release; only on the merge of
  # a release pull request. Written with the release GitHub App's token from
  # the `release` environment.
  tag:
    needs: [verify, publish]
    if: >-
      !cancelled() && needs.verify.outputs.mode == 'release' && needs.publish.result == 'success'
    uses: IronFlock/workflows/.github/workflows/release-tag.yml@v1
    permissions:
      contents: read
    # The App key is a secret of the `release` environment; environment
    # secrets reach a reusable workflow only through `secrets: inherit`.
    # No github-release: it would publish a release before its files exist.
    secrets: inherit # zizmor: ignore[secrets-inherit] # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    with:
      version-file: package.json

  finalize:
    name: publish GitHub release
    needs: [verify, tag]
    # `released` (a re-run after the tag): the tag job is skipped, and the
    # draft is published if an earlier attempt stopped short of it.
    if: >-
      !cancelled() && (needs.verify.outputs.mode == 'released' ||
      (needs.verify.outputs.mode == 'release' && needs.tag.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - name: release App token (contents of this repository)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: publish release ${{ needs.verify.outputs.tag }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          state=$(gh release list --limit 100 --json tagName,isDraft |
            jq -r --arg tag "$TAG" '.[] | select(.tagName == $tag) | if .isDraft then "draft" else "published" end')
          case "$state" in
            draft)
              gh release edit "$TAG" --draft=false --latest ;;
            published)
              echo "the release $TAG is already published" ;;
            *)
              echo "::error::there is no GitHub release $TAG"
              exit 1 ;;
          esac
