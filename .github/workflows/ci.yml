# Gate (eslint and type checks, Vitest, the app bundle) and workflow lint from
# the shared IronFlock CI harness. The gate skips the packaging steps of the
# install (scripts/postinstall.js); release-build runs them.
# Pull requests into main only: the ruleset lets nothing reach main without
# ci-ok. The release intent decides whether the merge releases; release pull
# requests also run release.yml as a dry run (every installer, unsigned, no
# publish).
name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    uses: IronFlock/workflows/.github/workflows/node-gate.yml@v1
    with:
      package-manager: npm
      node-version: "22"

  workflows:
    uses: IronFlock/workflows/.github/workflows/workflows-lint.yml@v1

  # The version decides: a bump makes a release PR (`just release-patch`,
  # title `release flockflasher v<version>`), an unchanged version a
  # no-release PR (`just merge`) whose merge releases nothing.
  intent:
    uses: IronFlock/workflows/.github/workflows/release-intent.yml@v1
    with:
      version-file: package.json

  # Release pull requests only: release.yml as a dry run (the installers of
  # every OS built, unsigned; nothing published, no tag), so a broken release
  # build never reaches main.
  release-build:
    needs: [intent]
    if: needs.intent.outputs.kind == 'release'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
    # No secrets: a dry run neither signs nor publishes.

  # The required check of the main-branch ruleset: green only when every job
  # above succeeded (skipped or cancelled counts as failed; release-build may be
  # skipped, on a no-release pull request).
  ci-ok:
    if: ${{ always() }}
    needs: [gate, workflows, intent, release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: all ci jobs succeeded
        env:
          REQUIRED: ${{ needs.gate.result }} ${{ needs.workflows.result }} ${{ needs.intent.result }}
          RELEASE_BUILD: ${{ needs.release-build.result }}
          KIND: ${{ needs.intent.outputs.kind }}
        run: |
          echo "required: $REQUIRED, release-build: $RELEASE_BUILD ($KIND)"
          for r in $REQUIRED; do [ "$r" = success ] || exit 1; done
          if [ "$KIND" = release ]; then [ "$RELEASE_BUILD" = success ]; else [ "$RELEASE_BUILD" = skipped ]; fi
