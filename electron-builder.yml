appId: com.ironflock.flockflasher # keep equal to setAppUserModelId in src/main/index.ts
productName: FlockFlasher
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,electron-builder.env,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # the command-line tool is a file of its own, not part of the app
  - '!out/cli/**'
  - '!vite.cli.config.{js,ts,mjs,cjs}'
asarUnpack:
  - resources/**
  # The elevated FLASH subprocess runs under the bundled real Node (resources/binaries),
  # which cannot read modules from inside the packed asar. Unpack node_modules so it can
  # require etcher-sdk and its dependency closure. (Electron-node consumers still read the
  # asar transparently, so the unmount path is unaffected.)
  - node_modules/**
win:
  executableName: FlockFlasher
  requestedExecutionLevel: requireAdministrator
  publish:
    provider: github
    owner: IronFlock
    repo: flasher
    updaterCacheDirName: flockflasher-updater
nsis:
  # NEVER change. The installer's identity (registry and uninstall keys), by default
  # derived from appId. Pinned to the value of the old appId
  # com.recordevolution.flockflasher, so installed apps keep upgrading in place
  # instead of getting a second copy next to the old one.
  guid: 85b3a452-7859-50c0-9291-836158c90649
  artifactName: ${name}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # macOS is not released: notarization needs a membership in the Apple
  # Developer Program, which has ended. A Mac build is for local use only.
  notarize: false
  publish:
    provider: github
    owner: IronFlock
    repo: flasher
    updaterCacheDirName: flockflasher-updater
dmg:
  artifactName: ${name}-${arch}.${ext}
linux:
  target:
    - AppImage
  publish:
    provider: github
    owner: IronFlock
    repo: flasher
    updaterCacheDirName: flockflasher-updater
appImage:
  artifactName: ${name}.${ext}
npmRebuild: false
protocols:
  - name: ironflock-protocol
    schemes:
      - flock
fileAssociations:
  - ext: flock
    description: IronFlock Device File
    icon: src/assets/icons/icon.icns
    mimeType: text/x-flock
    role: Viewer
electronVersion: 43.8.4 # keep equal to package.json `electron`
# NOTE: auto-update publishing is configured per-target (github) in the win/mac/linux
# blocks above. There is intentionally no top-level generic publish block: the old
# `https://example.com/auto-updates` placeholder pointed updates at a domain the
# project does not control.