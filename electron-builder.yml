appId: com.recordevolution.flockflasher
productName: FlockFlasher
afterSign: './scripts/notarize.js'
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  # The elevated FLASH subprocess runs under the bundled real Node (resources/binaries),
  # which cannot read modules from inside the packed asar. Unpack node_modules so it can
  # require etcher-sdk and its dependency closure. (Electron-node consumers still read the
  # asar transparently, so the unmount path is unaffected.)
  - node_modules/**
win:
  executableName: FlockFlasher
  requestedExecutionLevel: requireAdministrator
  publish:
    provider: github
    owner: IronFlock
    repo: flasher
    updaterCacheDirName: flockflasher-updater
nsis:
  artifactName: ${name}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  publish:
    provider: github
    owner: IronFlock
    repo: flasher
    updaterCacheDirName: flockflasher-updater
dmg:
  artifactName: ${name}-${arch}.${ext}
linux:
  target:
    - AppImage
  publish:
    provider: github
    owner: IronFlock
    repo: flasher
    updaterCacheDirName: flockflasher-updater
appImage:
  artifactName: ${name}.${ext}
npmRebuild: false
protocols:
  - name: ironflock-protocol
    schemes:
      - flock
  - name: reswarm-protocol
    schemes:
      - reswarm
fileAssociations:
  - ext: flock
    description: IronFlock Device File
    icon: src/assets/icons/icon.icns
    mimeType: text/x-reswarm
    role: Viewer
  - ext: reswarm
    description: Reswarm Device File
    icon: src/assets/icons/icon.icns
    mimeType: text/x-reswarm
    role: Viewer
electronVersion: 43.1.0 # Version
# NOTE: auto-update publishing is configured per-target (github) in the win/mac/linux
# blocks above. There is intentionally no top-level generic publish block: the old
# `https://example.com/auto-updates` placeholder pointed updates at a domain the
# project does not control.