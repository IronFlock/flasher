      xok 1.0.0 (via etcher-sdk > balena-image-fs > fatfs), a ten-line object
      extend helper. WTFPL puts no conditions on use or redistribution; trivy
      lists it as forbidden only because it is not OSI approved (reviewed
      2026-10-30).
    expired_at: 2027-10-30
